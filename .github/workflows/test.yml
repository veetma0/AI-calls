name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: ruff check app scripts tests
      - run: pytest -q
      - run: node --test tests/scenario.test.cjs
      - name: Prepare isolated mock configuration
        run: python scripts/init_env.py
      - name: Build and start Docker in mock mode
        run: docker compose up -d --build --wait --wait-timeout 60
      - name: Check container health
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down --volumes
